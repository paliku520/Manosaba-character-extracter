  disclaimer_p2: "『魔法少女ノ魔女裁判』公式の二次創作ガイドラインにより、データ解析などの方法でゲーム内の原本データ（画像・音声・テキスト等）を抽出し、再利用・再配布することは禁止されています。本ツールで抽出した内容は、二次創作・公開・再配布・商業利用のいずれにも使用できません。"
