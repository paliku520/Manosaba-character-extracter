  disclaimer_p4: "本プロジェクトは、ゲームの著作権者・発行元と一切の提携・推奨関係がありません。権利者様が本プロジェクトについて権利侵害またはガイドライン違反と判断された場合は、GitHub Issues にてメンテナーまでご連絡ください。確認のうえ、速やかに関連内容の修正または公開停止を行います。"
  disclaimer_p5: "本ツールはゲーム本体を提供しません。ゲームは利用者ご自身で適法な手段により入手してください。"
  thanks_text: "すべての【共犯者】の皆様のご支援とフィードバックに感謝します"

