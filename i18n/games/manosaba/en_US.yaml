# Manosaba-specific (English)
# Character names / story terms / per-character accents / game-name texts, Manosaba only

about:
  app_name: "Magical Girl Witch Trials Sprite Tool"
  description: "A desktop tool to extract and composite character sprites from the Magical Girl Witch Trials game files."
  license_note: "The content extracted by this tool is from the game \"Magical Girl Witch Trials\" (Manosaba)\n© 2024 Re,AER LLC. / Acacia — All rights reserved by the original game developer."
  disclaimer_title: "Disclaimer"
  disclaimer_p1: "This tool is developed for technical research and format-learning purposes, to study the structure of sprites and textures inside Unity AssetBundles. It does not host, provide, or index any original game assets from \"Magical Girl Witch Trials\" (Manosaba)."
  disclaimer_p2: "Per the official derivative-work guidelines of \"Magical Girl Witch Trials\", extracting original in-game data (images, audio, text, etc.) by means such as data parsing, and then reusing or redistributing it, is prohibited. None of the content produced with this tool may be used for derivative works, public release, redistribution, or any commercial purpose."
  disclaimer_p3: "Users are responsible for ensuring that their use complies with the official derivative-work guidelines and applicable laws. Any consequences arising from the use of this tool are borne solely by the user."
  disclaimer_p4: "This project has no affiliation with, or endorsement from, the game's copyright holders or publisher. If a rights holder believes this project infringes their rights or violates their guidelines, please contact the maintainer via GitHub Issues; the maintainer will adjust or take down the relevant content after verification."
  disclaimer_p5: "This tool does not provide the game itself; users must obtain the game through legitimate channels."
  thanks_text: "Thanks to all players for your support and feedback"

app:
  title: "Magical Girl Witch Trials - Character Sprite Tool"

dialog:
  spoiler_msg: "This tool contains major spoilers. It is highly recommended to complete the main story before using it, so as not to ruin your immersive experience."

console:
  startup_msg_electron: "Welcome to the Magical Girl Witch Trials Sprite Tool!\nThis window is the log console, used to show runtime logs.\n\nTip: Closing this window will not exit the program.\nTo quit, click the close button on the top-right of the main window."
  title: "Magical Girl Witch Trials - Character Sprite Tool - console"

info:
  guide_step1: "Click 'Load Game Directory' → choose your game folder (e.g. .../manosaba_game)"
  welcome_lead: "This tool helps you quickly extract and composite character sprites from the Magical Girl Witch Trials game files."
  welcome_title: "Welcome to Magical Girl Witch Trials Sprite Tool v{version}"

